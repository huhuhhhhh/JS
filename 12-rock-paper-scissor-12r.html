<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper scissors</title>
    <link rel="stylesheet" href="style/12-rock-paper-scissor-12r.css">
</head>
<body>
    <p class="title">Rock Paper Scissors</p>
    <button class="move-button js-rock-button"><img src="images/rock-emoji.png" alt="" class="move-icon"></button>
    <button class="move-button js-paper-button"><img src="images/paper-emoji.png" alt="" class="move-icon"></button>
    <button class="move-button js-scissors-button"><img src="images/scissors-emoji.png" alt="" class="move-icon"></button>

    <p class="js-result result"></p>
    <p class="js-moves score">
    </p>
    <p class="js-score"></p>

    <div class="js-confirm-message"></div>

    <button class="reset-score-button js-reset-score-button">
        Reset Score
    </button>

    <button class="auto-play-button js-auto-play-button">
        Auto Play
    </button>
    <script src="script/12-rock-paper-scissor-12r.js"></script>
</body>
</html>
