<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock paper scissors</title>
    <link rel="stylesheet" href="style/10-rock-paper-scissor.css">
</head>
<body>
    <p class="title">Rock Paper Scissors</p>
    <button class="move-button" onclick="
        playGame('Rock');
    "><img src="images/rock-emoji.png" alt="" class="move-icon"></button>
    <button class="move-button" onclick="
        playGame('Paper');
    "><img src="images/paper-emoji.png" alt="" class="move-icon"></button>
    <button class="move-button" onclick="
        playGame('Scissors');       
    "><img src="images/scissors-emoji.png" alt="" class="move-icon"></button>

    <p class="js-result result"></p>
    <p class="js-moves score">
    </p>
    <p class="js-score"></p>

    <button onclick="
        score.wins = 0;
        score.losses = 0;
        score.ties = 0;
        updateScore('');
        document.querySelector('.js-moves').innerHTML = '';
        alert('score has been reset');
    " class="reset-score-button">
        Reset Score
    </button>
    <script src="script/10-rock-paper-scissor.js"></script>
</body>
</html>
