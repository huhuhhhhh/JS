        function findIndex(array, word) {
            let index = -1;

            for(let i=0; i< array.length; i++) {
                if(array[i] == word) {
                    index = i;
                    break;
                }
            }

            console.log(`the ${word} index is ${index}`);
            return index;
        }

        // findIndex(['green', 'red', 'blue', 'red'], 'red');

        function unique(array) {
            let uniqueArray = []
            
            for(let j=0; j<array.length; j++) {
                let duplicateWord = findIndex(uniqueArray, array[j]);
                // console.log(duplicateWord);
                if(duplicateWord === -1){
                    uniqueArray.push(array[j]);
                }
            }
            console.log(uniqueArray);
        }
