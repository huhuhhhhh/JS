<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dom project</title>
</head>
<body>
    <p>
        YouTube Subscribe Button
    </p>
    <button onclick="
        subscribe();
    " class="js-subscribe-button">Subscribe</button>

    <p>Amazon Shipping Calculator</p>
    <input class="js-cost-input" type="text" placeholder="Cost of order" onkeydown="
        handleCostKeydown(event)
    ">
    <button onclick="CalculateTotal()">Calculate</button>
    <p class="js-cost-total"></p>

    <script>
        function handleCostKeydown(event) {
            if(event.key == 'Enter') {
                CalculateTotal();
            }
        }

        function subscribe() {
            const buttonElement = document.querySelector('.js-subscribe-button');

            if(buttonElement.innerText === 'Subscribe') {
                buttonElement.innerHTML = 'Subscribed';
            } else {
                buttonElement.innerHTML = 'Subscribe';
            }
        }

        function CalculateTotal() {
            const inputElement = document.querySelector('.js-cost-input');
            let cost = Number(inputElement.value);

            if(cost < 40) {
                cost += 10;
            }

            console.log(cost);

            document.querySelector('.js-cost-total').innerHTML = `$ ${cost.toFixed(2)}`;
        }

    </script>
    
</body>
</html>
